[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "guardian-core"
version = "0.1.0"
description = "MVP - V1: QA Automation Platform with Spec Driven Development"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Maria Valencia", email = "maria@example.com"}
]
keywords = ["QA", "Testing", "Automation", "SDD", "Spec-Driven Development"]

dependencies = [
    "fastapi==0.104.1",
    "uvicorn[standard]==0.24.0",
    "python-multipart==0.0.6",
    "openai==1.3.0",
    "python-dotenv==1.0.0",
    "jinja2>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest==7.4.3",
    "pytest-asyncio==0.21.1",
    "black==23.12.0",
    "ruff==0.1.8",
    "mypy==1.7.0",
]

playwright = [
    "playwright>=1.40.0",
]

[project.urls]
Homepage = "https://github.com/MariaCVal07/guardian-core"
Repository = "https://github.com/MariaCVal07/guardian-core.git"
Issues = "https://github.com/MariaCVal07/guardian-core/issues"

[tool.setuptools]
packages = ["backend", "frontend"]

[tool.setuptools.package-data]
backend = ["agents/**/*.md", "agents/**/*.json"]
frontend = ["templates/**/*.html", "static/**/*.css"]

[tool.pytest.ini_options]
testpaths = ["specs"]
python_files = "test_*.py"
addopts = "-v --strict-markers"
markers = [
    "spec: Spec-Driven Development tests",
    "integration: Integration tests",
    "unit: Unit tests",
]

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311', 'py312']

[tool.ruff]
line-length = 100
target-version = "py39"
select = ["E", "W", "F", "I", "C", "B"]
ignore = ["E501", "W503"]